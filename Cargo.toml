[workspace]
resolver = "2"
members = [
    "crates/usta-proto",
    "crates/usta-core",
    "crates/usta-providers",
    "crates/usta-index",
    "crates/usta-pm",
    "crates/usta-roles",
    "crates/usta-daemon",
    "crates/usta-cli",
    "crates/usta-mcp",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
authors = ["danial <danial.zaferanchi@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/danialza/Usta"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
tonic = "0.12"
tonic-build = "0.12"
prost = "0.13"
prost-types = "0.13"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-stream = { version = "0.1", features = ["net"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = "0.5"
clap = { version = "4.5", features = ["derive"] }
directories = "5"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures = "0.3"
async-stream = "0.3"
bytes = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
portable-pty = "0.8"
crossterm = "0.28"
uuid = { version = "1", features = ["v4"] }
owo-colors = "4"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
nix = { version = "0.29", features = ["signal", "process"] }
ignore = "0.4"
fastembed = "4"
walkdir = "2"
serde_yaml = "0.9"
