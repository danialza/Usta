<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="Usta — your AI engineering team">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0b0c1c"/>
      <stop offset="55%"  stop-color="#050810"/>
      <stop offset="100%" stop-color="#08061c"/>
    </linearGradient>
    <linearGradient id="tagG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3DECFF"/>
      <stop offset="50%" stop-color="#8B7CF6"/>
      <stop offset="100%" stop-color="#F45BA5"/>
    </linearGradient>
    <radialGradient id="glowTop" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B7CF6" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#8B7CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3DECFF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#3DECFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F45BA5" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#F45BA5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>
  <ellipse cx="400" cy="180" rx="520" ry="360" fill="url(#glowTop)"/>
  <ellipse cx="40" cy="640" rx="320" ry="320" fill="url(#glowL)"/>
  <ellipse cx="780" cy="720" rx="320" ry="320" fill="url(#glowR)"/>
  <circle cx="400" cy="500" r="470" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.035"/>

  <!-- Logo (hero) -->
  <image href="usta-logo.png" x="295" y="120" width="210" height="210" preserveAspectRatio="xMidYMid meet"/>

  <!-- Wordmark -->
  <text x="400" y="440" text-anchor="middle"
        font-family="ui-sans-serif, -apple-system, 'Inter', system-ui, sans-serif"
        font-size="104" font-weight="800" letter-spacing="-4" fill="#F0F1F7">Usta</text>

  <!-- Tagline -->
  <text x="400" y="510" text-anchor="middle"
        font-family="ui-sans-serif, -apple-system, 'Inter', system-ui, sans-serif"
        font-size="36" font-weight="700" letter-spacing="-0.5" fill="url(#tagG)">Your AI engineering team.</text>

  <!-- Plain explanation -->
  <text x="400" y="612" text-anchor="middle"
        font-family="ui-sans-serif, -apple-system, 'Inter', system-ui, sans-serif"
        font-size="29" font-weight="500" fill="#cdd0e0">You describe what you want to build.</text>
  <text x="400" y="656" text-anchor="middle"
        font-family="ui-sans-serif, -apple-system, 'Inter', system-ui, sans-serif"
        font-size="29" font-weight="500" fill="#cdd0e0">A PM agent builds the team.</text>
  <text x="400" y="700" text-anchor="middle"
        font-family="ui-sans-serif, -apple-system, 'Inter', system-ui, sans-serif"
        font-size="29" font-weight="500" fill="#cdd0e0">They work in parallel and ship it.</text>

  <!-- 3-step chips -->
  <g font-family="ui-sans-serif, -apple-system, 'Inter', system-ui, sans-serif" font-size="19" font-weight="600" text-anchor="middle">
    <g transform="translate(148 770)">
      <rect width="148" height="50" rx="25" fill="none" stroke="#3DECFF" stroke-width="1.3"/>
      <text x="74" y="32" fill="#3DECFF">Describe</text>
    </g>
    <text x="326" y="803" fill="#5a5f80" font-size="26">→</text>
    <g transform="translate(326 770)">
      <rect width="148" height="50" rx="25" fill="none" stroke="#8B7CF6" stroke-width="1.3"/>
      <text x="74" y="32" fill="#8B7CF6">PM plans</text>
    </g>
    <text x="504" y="803" fill="#5a5f80" font-size="26">→</text>
    <g transform="translate(504 770)">
      <rect width="148" height="50" rx="25" fill="none" stroke="#F45BA5" stroke-width="1.3"/>
      <text x="74" y="32" fill="#F45BA5">Team ships</text>
    </g>
  </g>

  <!-- Native macOS line -->
  <text x="400" y="892" text-anchor="middle"
        font-family="ui-sans-serif, -apple-system, 'Inter', system-ui, sans-serif"
        font-size="20" font-weight="500" letter-spacing="0.5" fill="#9aa0bf">Native macOS · Claude · Gemini · Ollama · Open source</text>

  <!-- URL -->
  <text x="400" y="946" text-anchor="middle"
        font-family="ui-monospace, Menlo, monospace"
        font-size="20" font-weight="500" fill="#6b7095">github.com/danialza/Usta</text>
</svg>
