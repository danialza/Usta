<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="Usta — your AI engineering team">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0b0c1c"/>
      <stop offset="55%"  stop-color="#050810"/>
      <stop offset="100%" stop-color="#08061c"/>
    </linearGradient>
    <linearGradient id="tagG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3DECFF"/>
      <stop offset="50%" stop-color="#8B7CF6"/>
      <stop offset="100%" stop-color="#F45BA5"/>
    </linearGradient>
    <radialGradient id="glowTop" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B7CF6" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#8B7CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3DECFF" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#3DECFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F45BA5" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#F45BA5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shotFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="68%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#050810" stop-opacity="0.65"/>
    </linearGradient>
    <clipPath id="shotClip"><rect x="56" y="612" width="688" height="312" rx="16"/></clipPath>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>
  <ellipse cx="400" cy="100" rx="520" ry="320" fill="url(#glowTop)"/>
  <ellipse cx="40" cy="520" rx="320" ry="320" fill="url(#glowL)"/>
  <ellipse cx="780" cy="560" rx="320" ry="320" fill="url(#glowR)"/>
  <circle cx="400" cy="330" r="400" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.035"/>

  <!-- Logo (hero) -->
  <image href="usta-logo.png" x="320" y="30" width="160" height="160" preserveAspectRatio="xMidYMid meet"/>

  <!-- Wordmark -->
  <text x="400" y="286" text-anchor="middle"
        font-family="ui-sans-serif, -apple-system, 'Inter', system-ui, sans-serif"
        font-size="88" font-weight="800" letter-spacing="-3.5" fill="#F0F1F7">Usta</text>

  <!-- Tagline -->
  <text x="400" y="344" text-anchor="middle"
        font-family="ui-sans-serif, -apple-system, 'Inter', system-ui, sans-serif"
        font-size="32" font-weight="700" letter-spacing="-0.5" fill="url(#tagG)">Your AI engineering team.</text>

  <!-- Plain explanation -->
  <text x="400" y="420" text-anchor="middle"
        font-family="ui-sans-serif, -apple-system, 'Inter', system-ui, sans-serif"
        font-size="26" font-weight="500" fill="#cdd0e0">You describe what you want to build.</text>
  <text x="400" y="458" text-anchor="middle"
        font-family="ui-sans-serif, -apple-system, 'Inter', system-ui, sans-serif"
        font-size="26" font-weight="500" fill="#cdd0e0">A PM agent builds the team.</text>
  <text x="400" y="496" text-anchor="middle"
        font-family="ui-sans-serif, -apple-system, 'Inter', system-ui, sans-serif"
        font-size="26" font-weight="500" fill="#cdd0e0">They work in parallel and ship it.</text>

  <!-- 3-step chips with crisp path arrows -->
  <g font-family="ui-sans-serif, -apple-system, 'Inter', system-ui, sans-serif" font-size="19" font-weight="600" text-anchor="middle">
    <g transform="translate(130 534)">
      <rect width="150" height="48" rx="24" fill="none" stroke="#3DECFF" stroke-width="1.4"/>
      <text x="75" y="31" fill="#3DECFF">Describe</text>
    </g>
    <path d="M288 558 L316 558 M309 552 L317 558 L309 564" fill="none" stroke="#6b7095" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(325 534)">
      <rect width="150" height="48" rx="24" fill="none" stroke="#8B7CF6" stroke-width="1.4"/>
      <text x="75" y="31" fill="#8B7CF6">PM plans</text>
    </g>
    <path d="M483 558 L511 558 M504 552 L512 558 L504 564" fill="none" stroke="#6b7095" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(520 534)">
      <rect width="150" height="48" rx="24" fill="none" stroke="#F45BA5" stroke-width="1.4"/>
      <text x="75" y="31" fill="#F45BA5">Team ships</text>
    </g>
  </g>

  <!-- App screenshot (bigger, lower) -->
  <g clip-path="url(#shotClip)">
    <image href="screenshots/guide/08-workspace-hero.png" x="56" y="612" width="688" height="439" preserveAspectRatio="xMidYMid slice"/>
    <rect x="56" y="612" width="688" height="312" fill="url(#shotFade)"/>
  </g>
  <rect x="56" y="612" width="688" height="312" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.5"/>

  <!-- URL -->
  <text x="400" y="966" text-anchor="middle"
        font-family="ui-monospace, Menlo, monospace"
        font-size="20" font-weight="500" fill="#6b7095">github.com/danialza/Usta</text>
</svg>
