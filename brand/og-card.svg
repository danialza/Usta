<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="Usta — Your AI engineering team">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0a0b18"/>
      <stop offset="50%"  stop-color="#050810"/>
      <stop offset="100%" stop-color="#07051a"/>
    </linearGradient>
    <linearGradient id="taglineG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3DECFF"/>
      <stop offset="50%" stop-color="#8B7CF6"/>
      <stop offset="100%" stop-color="#F45BA5"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1100" cy="80" r="220" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.04"/>
  <circle cx="-60" cy="600" r="260" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.04"/>

  <image href="usta-logo.png" x="440" y="80" width="320" height="320" preserveAspectRatio="xMidYMid meet"/>

  <text x="600" y="495" text-anchor="middle"
        font-family="ui-sans-serif, -apple-system, 'Inter', system-ui, sans-serif"
        font-size="92" font-weight="700" letter-spacing="-3" fill="#F0F1F7">Usta</text>

  <text x="600" y="555" text-anchor="middle"
        font-family="ui-sans-serif, -apple-system, 'Inter', system-ui, sans-serif"
        font-size="26" font-weight="500" letter-spacing="2" fill="url(#taglineG)">
    YOUR AI ENGINEERING TEAM. NOT AN ASSISTANT.
  </text>
</svg>
