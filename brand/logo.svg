<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Usta">
  <title>Usta</title>
  <desc>Three vertical agent panes joined by a U base — multi-agent IDE</desc>
  <defs>
    <linearGradient id="paneCyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3DECFF"/><stop offset="55%" stop-color="#15D5F0"/><stop offset="100%" stop-color="#0BB1CC"/>
    </linearGradient>
    <linearGradient id="paneBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5A9DFF"/><stop offset="55%" stop-color="#5A7BF0"/><stop offset="100%" stop-color="#4B5FD8"/>
    </linearGradient>
    <linearGradient id="panePink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF6BC4"/><stop offset="55%" stop-color="#F45BA5"/><stop offset="100%" stop-color="#E14C8E"/>
    </linearGradient>
    <linearGradient id="baseLeft" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#4B5FD8"/><stop offset="100%" stop-color="#7C5FF0"/>
