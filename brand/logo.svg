  <path d="M 174 32 L 198 32 L 198 158 L 174 168 Z" fill="url(#panePink)" opacity="0.92"/>
  <path d="M 206 30 L 238 30 L 238 168 L 206 160 Z" fill="url(#panePink)"/>
  <path d="M 38 168 L 128 215 L 128 235 L 38 195 Z" fill="url(#baseLeft)"/>
  <path d="M 128 215 L 238 168 L 238 195 L 128 235 Z" fill="url(#baseRight)"/>
