name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (daemon + cli + mcp)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc
        run: brew install protobuf
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace
      - name: Clippy (informational)
        run: cargo clippy --workspace -- -D warnings || true

  mac:
    name: Mac app (SwiftPM)
    # macos-26 ships Xcode 26.x — grpc-swift-nio-transport needs the newer
    # SDK (SecCertificate is only Sendable there).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc (needed by GRPCProtobufGenerator plugin)
        run: brew install protobuf
      - name: Build
        run: swift build --package-path apps/mac
        env:
          # Let the SwiftPM build plugin find the brew-installed protoc.
          PROTOC_PATH: /opt/homebrew/bin/protoc
